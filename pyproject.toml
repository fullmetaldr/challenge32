[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "challenge32"
version = "0.1.0"
description = "Versioned deck synchronizer for the Challenge32 Magic: The Gathering project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27,<1",
    "mtg-parser>=0.0.1a55,<0.1",
]

[project.scripts]
challenge32 = "challenge32.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
challenge32 = ["templates/*"]
