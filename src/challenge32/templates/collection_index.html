<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Challenge32 Collection</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="wrap">
    <header class="page-header">
      <div>
        <p class="eyebrow">Challenge32</p>
        <h1>Collection dashboard</h1>
        <p class="muted">Generated from source-controlled collection files and decklists.</p>
      </div>
      <p id="generated-at" class="muted"></p>
    </header>

    <section id="summary" class="summary-grid" aria-label="Collection summary"></section>

    <section id="warnings" class="panel hidden" aria-labelledby="warnings-title">
      <h2 id="warnings-title"><button class="panel-toggle" type="button" aria-expanded="true" aria-controls="warnings-content">Needs attention</button></h2>
      <div id="warnings-content" class="panel-content">
        <div id="warning-list"></div>
      </div>
    </section>

    <section class="panel" aria-labelledby="inventory-title">
      <h2 id="inventory-title"><button class="panel-toggle" type="button" aria-expanded="true" aria-controls="inventory-content">Inventory</button></h2>
      <div id="inventory-content" class="panel-content">
        <div class="section-heading">
          <p id="inventory-count" class="muted"></p>
          <div class="filters">
            <label>Search <input id="search" type="search" placeholder="Card, set or number"></label>
            <label>Status
              <select id="status-filter">
                <option value="all">All</option>
                <option value="accounted">Accounted</option>
                <option value="location-unknown">Location unknown</option>
                <option value="ownership-unknown">Ownership unknown</option>
                <option value="conflict">Conflict</option>
              </select>
            </label>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Card</th>
                <th>Preview</th>
                <th>Set</th>
                <th>Card No.</th>
                <th>Foil</th>
                <th>Known</th>
                <th>Decks</th>
                <th>Other locations</th>
                <th>Free / unresolved</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="inventory-body"></tbody>
          </table>
        </div>
        <nav id="inventory-pagination" class="pagination" aria-label="Inventory pages" hidden>
          <button id="previous-page" type="button">Previous</button>
          <label for="inventory-page">Page</label>
          <select id="inventory-page" aria-label="Inventory page"></select>
          <span id="page-count"></span>
          <button id="next-page" type="button">Next</button>
        </nav>
      </div>
    </section>

    <div id="card-preview" class="card-preview hidden" role="tooltip" aria-live="polite"></div>

    <div class="columns">
      <section class="panel" aria-labelledby="locations-title">
        <h2 id="locations-title"><button class="panel-toggle" type="button" aria-expanded="true" aria-controls="locations">Locations</button></h2>
        <div id="locations" class="panel-content"></div>
      </section>
      <section class="panel" aria-labelledby="decks-title">
        <h2 id="decks-title"><button class="panel-toggle" type="button" aria-expanded="true" aria-controls="decks">Deck allocation</button></h2>
        <div id="decks" class="panel-content"></div>
      </section>
    </div>
  </main>
  <script src="assets/app.js"></script>
</body>
</html>
